[package]
name = "schema-curd"
version = "0.1.0"
edition = "2024"

[features]
default = ["mysql"]
sqlite = ["sqlx/sqlite"]
mysql = []

[dependencies]
corers = { version = "0.1.0", path = "../../corers", features = ["axum", "tracing", "jwt"]}

anyhow = "1.0.103"
argon2 = { version = "0.5.3", features = ["std"]}
async-trait = "0.1.89"
# axum = "0.8.9"
axum = { version = "0.8.9", features = ["macros"] }
validator = { version = "0.20.0", features = ["derive"] }
tracing-appender = "0.2.4"

base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
jsonwebtoken = "9.3.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
redis = { version = "0.32.7", features = ["tokio-comp"] }
regex = "1.12.3"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["mysql", "mysql-rsa", "postgres", "runtime-tokio", "json", "macros", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15.7"
envy = "0.4.2"
rexl = { version = "0.0.5", features = ["serde"] }
kevy-embedded = { version = "=4.1.1", default-features = false, features = ["core"] }
indoc = "2.0.7"
strum = { version = "0.28.0", features = ["derive"] }
moka = { version = "0.12.16", features = ["future"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
